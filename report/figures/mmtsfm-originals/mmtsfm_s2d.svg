<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1060" viewBox="0 0 1240 1060">
<!-- MINIMAL LAYOUT  (structure only; all rationale lives in the caption)
     row A in  : y 30..100    cols 60..360 | 390..690 | 720..1060
     row B fe  : y 130..176   same cols
     row C     : numeric 60..690 y 206..258  |  vision stack 720..1060 y 206..468
     row D asm : y 540..700   60..1060   (interleaved token strip, single anchor)
     row E enc : y 790..920   sub-blocks 80..380 | 400..700 | 720..1040
     row F out : y 946..1020  head 60..360 | Y_hat 420..660
     shape labels: x 1072 (right margin)
     Cairo notes: ASCII only ("->", "x", ". . ."); no tspan; >=20 px line spacing.
-->
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#3A3A44"/>
  </marker>
  <marker id="arrowLight" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#7A7A86"/>
  </marker>
</defs>

<rect x="0" y="0" width="1240" height="1060" fill="#FFFFFF"/>

<g id="inputs"><title>Input tensors</title>
  <rect x="60" y="30" width="300" height="70" rx="3" fill="#FFFFFF" stroke="#4A4A55" stroke-width="1.8"/>
  <text x="210" y="56" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#1E1E28">PV power history</text>
  <text x="210" y="80" text-anchor="middle" font-family="Times New Roman, serif" font-style="italic" font-size="14" fill="#2E2E38">Y_hist   [B, 672]</text>

  <rect x="390" y="30" width="300" height="70" rx="3" fill="#FFFFFF" stroke="#4A4A55" stroke-width="1.8"/>
  <text x="540" y="56" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#1E1E28">Known covariates</text>
  <text x="540" y="80" text-anchor="middle" font-family="Times New Roman, serif" font-style="italic" font-size="14" fill="#2E2E38">X_cov   [B, 684, 14]</text>

  <rect x="720" y="30" width="340" height="70" rx="3" fill="#FFFFFF" stroke="#4A4A55" stroke-width="1.8"/>
  <text x="890" y="56" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#1E1E28">Satellite video -- 8 frames</text>
  <text x="890" y="80" text-anchor="middle" font-family="Times New Roman, serif" font-style="italic" font-size="14" fill="#2E2E38">V   [B, 3, 8, 224, 224]</text>
</g>

<g id="frontends"><title>Per-modality front ends</title>
  <rect x="60" y="130" width="300" height="46" rx="8" fill="#DCEAF7" stroke="#4C7FB0" stroke-width="1.8"/>
  <text x="210" y="159" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#1B3A55">InstanceNorm + Patch(16)</text>

  <rect x="390" y="130" width="300" height="46" rx="8" fill="#DCEAF7" stroke="#4C7FB0" stroke-width="1.8"/>
  <text x="540" y="159" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#1B3A55">Per-channel patching</text>

  <rect x="720" y="130" width="340" height="46" rx="8" fill="#E8E8EA" stroke="#8A8A93" stroke-width="1.8"/>
  <text x="890" y="159" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#33333B">V-JEPA 2.1  ViT-L/16   (FROZEN)</text>
</g>

<g id="numericPath"><title>Numeric tokenisation</title>
  <rect x="60" y="206" width="630" height="52" rx="8" fill="#DCEAF7" stroke="#4C7FB0" stroke-width="1.8"/>
  <text x="375" y="238" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#1B3A55">input_patch_embedding   (PRETRAINED)</text>
</g>

<g id="visionPath"><title>Resampler-free visual path</title>
  <rect x="720" y="206" width="340" height="46" rx="8" fill="#FBE3D6" stroke="#D97742" stroke-width="1.8"/>
  <text x="890" y="235" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#7A3A10">1.  Mean pool, r = 2   (14x14 -&gt; 7x7)</text>

  <rect x="720" y="278" width="340" height="46" rx="8" fill="#FBE3D6" stroke="#D97742" stroke-width="1.8"/>
  <text x="890" y="307" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#7A3A10">2.  MLP projector   1024 -&gt; 768</text>

  <rect x="720" y="350" width="340" height="46" rx="8" fill="#FBE3D6" stroke="#D97742" stroke-width="1.8"/>
  <text x="890" y="379" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#7A3A10">3.  Spatial cell embedding   49 x 768</text>

  <rect x="720" y="422" width="340" height="46" rx="8" fill="#FBE3D6" stroke="#D97742" stroke-width="2.6"/>
  <text x="890" y="451" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#7A3A10">4.  EVS pruning   98 of 196  (q = 0.5)</text>
</g>

<g id="assembly"><title>Interleaved assembly inside the final context patch</title>
  <rect x="60" y="540" width="1000" height="160" rx="10" fill="#FBE3D6" stroke="#D97742" stroke-width="1.8"/>
  <text x="560" y="568" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="bold" fill="#7A3A10">5.  Interleaved assembly -- one anchor inside context patch 41   (parameter-free)</text>

  <g id="numericTokens">
    <rect x="90" y="592" width="270" height="40" rx="4" fill="#DCEAF7" stroke="#4C7FB0" stroke-width="1.6"/>
    <text x="225" y="617" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#1B3A55">P0  . . .  P40</text>

    <rect x="364" y="592" width="42" height="40" rx="4" fill="#DCEAF7" stroke="#4C7FB0" stroke-width="2.2"/>
    <text x="385" y="617" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#1B3A55">P41</text>
    <text x="385" y="654" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#5A5A66">p = 41</text>
  </g>

  <g id="visualTokens">
    <rect x="430" y="592" width="110" height="40" rx="4" fill="#F3B98E" stroke="#D97742" stroke-width="1.8"/>
    <text x="485" y="617" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#6B3008">slice 0</text>

    <rect x="550" y="592" width="110" height="40" rx="4" fill="#F3B98E" stroke="#D97742" stroke-width="1.8"/>
    <text x="605" y="617" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#6B3008">slice 1</text>

    <rect x="670" y="592" width="110" height="40" rx="4" fill="#F3B98E" stroke="#D97742" stroke-width="1.8"/>
    <text x="725" y="617" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#6B3008">slice 2</text>

    <rect x="790" y="592" width="110" height="40" rx="4" fill="#F3B98E" stroke="#D97742" stroke-width="1.8"/>
    <text x="845" y="617" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#6B3008">slice 3</text>

    <text x="665" y="654" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#7A3A10">p = 41 + (1 - dt / span) x 0.99</text>
  </g>

  <g id="futureToken">
    <rect x="940" y="592" width="60" height="40" rx="4" fill="#FDF0C8" stroke="#C9971E" stroke-width="2"/>
    <text x="970" y="617" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#6B4E06">future</text>
    <text x="970" y="654" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#5A5A66">p = 42</text>
  </g>

  <text x="560" y="686" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-style="italic" font-size="11" fill="#7A3A10">one anchor at the forecast origin -- all 98 visual tokens land in the last context patch</text>
</g>

<text x="560" y="748" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-style="italic" font-size="11.5" fill="#4A4A55">[B, 141, 768]  =  42 numeric + 98 visual + 1 future,  fractional position ids</text>

<g id="encoder"><title>Chronos2Encoder</title>
  <rect x="60" y="790" width="1000" height="130" rx="12" fill="#EDF3F9" stroke="#4C7FB0" stroke-width="1.6"/>
  <text x="78" y="814" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="bold" fill="#1B3A55">Chronos2Encoder  --  x12 identical blocks   (top 3 train at 0.1x LR)</text>

  <rect x="80" y="830" width="300" height="70" rx="8" fill="#DCEAF7" stroke="#D97742" stroke-width="2.6"/>
  <text x="230" y="871" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#1B3A55">TimeSelfAttention + RoPE</text>

  <rect x="400" y="830" width="300" height="70" rx="8" fill="#DCEAF7" stroke="#4C7FB0" stroke-width="1.6"/>
  <text x="550" y="871" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#1B3A55">GroupSelfAttention</text>

  <rect x="720" y="830" width="320" height="70" rx="8" fill="#DCEAF7" stroke="#4C7FB0" stroke-width="1.6"/>
  <text x="880" y="871" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#1B3A55">FeedForward</text>
</g>

<g id="head"><title>Output head and forecast</title>
  <rect x="60" y="960" width="300" height="46" rx="8" fill="#FBE3D6" stroke="#D97742" stroke-width="1.8"/>
  <text x="210" y="989" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#7A3A10">Output head   (TRAINABLE)</text>

  <rect x="420" y="946" width="240" height="74" rx="3" fill="#FDF0C8" stroke="#C9971E" stroke-width="2"/>
  <text x="540" y="976" text-anchor="middle" font-family="Times New Roman, serif" font-style="italic" font-size="18" fill="#6B4E06">Y_hat</text>
  <text x="540" y="1000" text-anchor="middle" font-family="Times New Roman, serif" font-style="italic" font-size="14" fill="#6B4E06">[B, 12, 9]</text>
</g>

<g id="edges" stroke="#3A3A44" stroke-width="1.8" fill="none">
  <path d="M 210 100 L 210 128" marker-end="url(#arrow)"/>
  <path d="M 540 100 L 540 128" marker-end="url(#arrow)"/>
  <path d="M 890 100 L 890 128" marker-end="url(#arrow)"/>
  <path d="M 210 176 L 210 204" marker-end="url(#arrow)"/>
  <path d="M 540 176 L 540 204" marker-end="url(#arrow)"/>
  <path d="M 890 176 L 890 204" marker-end="url(#arrow)"/>
  <path d="M 890 252 L 890 276" marker-end="url(#arrow)"/>
  <path d="M 890 324 L 890 348" marker-end="url(#arrow)"/>
  <path d="M 890 396 L 890 420" marker-end="url(#arrow)"/>
  <path d="M 890 468 L 890 538" marker-end="url(#arrow)"/>
  <path d="M 375 258 L 375 538" marker-end="url(#arrow)"/>
  <path d="M 970 700 L 970 788" marker-end="url(#arrow)"/>
  <path d="M 210 920 L 210 958" marker-end="url(#arrow)"/>
  <path d="M 360 983 L 416 983" marker-end="url(#arrow)"/>
</g>

<g id="innerEdges" stroke="#7A7A86" stroke-width="1.6" fill="none">
  <path d="M 380 865 L 396 865" marker-end="url(#arrowLight)"/>
  <path d="M 700 865 L 716 865" marker-end="url(#arrowLight)"/>
</g>

<g id="edgeLabels" font-family="Helvetica, Arial, sans-serif" font-style="italic" font-size="11.5" fill="#4A4A55">
  <text x="222" y="198">[B, 42, 16] patches</text>
  <text x="552" y="198">14 channel rows</text>
  <text x="1072" y="198">cached latents  [4, 196, 1024]</text>
  <text x="1072" y="270">[4, 49, 1024]</text>
  <text x="1072" y="414">[4, 49, 768]</text>
  <text x="1072" y="510">98 visual tokens</text>
  <text x="388" y="404">[B, 42, 768]  +  future</text>
  <text x="222" y="948">last hidden state   [B, 1, 768]</text>
</g>

<g id="legend"><title>Legend</title>
  <rect x="1072" y="592" width="150" height="122" rx="8" fill="#FCFCFD" stroke="#C6C6CE" stroke-width="1.2"/>
  <rect x="1086" y="610" width="20" height="12" rx="4" fill="#FBE3D6" stroke="#D97742" stroke-width="1.3"/>
  <text x="1114" y="620" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#3A3A44">visual path</text>
  <rect x="1086" y="634" width="20" height="12" rx="4" fill="#F3B98E" stroke="#D97742" stroke-width="1.3"/>
  <text x="1114" y="644" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#3A3A44">visual tokens</text>
  <rect x="1086" y="658" width="20" height="12" rx="4" fill="#DCEAF7" stroke="#4C7FB0" stroke-width="1.3"/>
  <text x="1114" y="668" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#3A3A44">Chronos-2</text>
  <rect x="1086" y="682" width="20" height="12" rx="4" fill="#E8E8EA" stroke="#8A8A93" stroke-width="1.3"/>
  <text x="1114" y="692" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#3A3A44">frozen</text>
</g>

</svg>
