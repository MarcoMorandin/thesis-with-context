<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1180" viewBox="0 0 1500 1180">
<!-- LAYOUT PLAN  (shared grid across the stage figures)
     row A in : y 40..140    3 cols 90..440 | 480..830 | 870..1180
     row B fe : y 180..258   same cols
     row C prj: y 296..400   numeric 90..830 | vision 870..1180
     row D mem: y 438..512   90..1180
     row E fus: y 550..682   90..1180
     row F enc: y 720..1022  sub-blocks 110..450 | 470..810 | 830..1170
     row G out: y 1060..1140 90..500 | 540..790
     rail     : x 1240..1460 (legend 40..262)
     NOTE: Cairo mis-spaces the "fu" pair in Times italic, so annotations use
     Helvetica italic; serif italic is kept for single symbols only.
-->
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#3A3A44"/>
  </marker>
  <marker id="arrowLight" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#7A7A86"/>
  </marker>
</defs>

<rect x="0" y="0" width="1500" height="1180" fill="#FFFFFF"/>

<g id="inputs"><title>Input tensors</title>
  <rect x="90" y="40" width="350" height="100" rx="3" fill="#FFFFFF" stroke="#4A4A55" stroke-width="1.8"/>
  <text x="265" y="64" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#1E1E28">Numeric target -- PV power</text>
  <text x="265" y="88" text-anchor="middle" font-family="Times New Roman, serif" font-style="italic" font-size="14" fill="#2E2E38">Y_hist   [B, 672]</text>
  <text x="265" y="110" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#5A5A66">672 historical steps per entity</text>

  <rect x="480" y="40" width="350" height="100" rx="3" fill="#FFFFFF" stroke="#4A4A55" stroke-width="1.8"/>
  <text x="655" y="64" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#1E1E28">Known covariates</text>
  <text x="655" y="88" text-anchor="middle" font-family="Times New Roman, serif" font-style="italic" font-size="14" fill="#2E2E38">X_cov   [B, 672 + 12, 14]</text>
  <text x="655" y="110" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#5A5A66">14 protocol channels</text>

  <rect x="870" y="40" width="310" height="100" rx="3" fill="#FFFFFF" stroke="#4A4A55" stroke-width="1.8"/>
  <text x="1025" y="64" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#1E1E28">Sky / satellite video</text>
  <text x="1025" y="88" text-anchor="middle" font-family="Times New Roman, serif" font-style="italic" font-size="14" fill="#2E2E38">V   [B, 3, 8, 224, 224]</text>
  <text x="1025" y="110" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#5A5A66">8 RGB frames over a 6 h window</text>
  <text x="1025" y="130" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#5A5A66">ending at the forecast origin</text>
</g>

<g id="frontends"><title>Per-modality front ends</title>
  <rect x="90" y="180" width="350" height="78" rx="8" fill="#DCEAF7" stroke="#4C7FB0" stroke-width="1.8"/>
  <text x="265" y="204" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#1B3A55">InstanceNorm (arcsinh) + Patch(16)</text>
  <text x="265" y="226" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#2F4E68">out: patched context and per-patch mask</text>
  <text x="265" y="246" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#2F4E68">plus (loc, scale), kept for the inverse</text>

  <rect x="480" y="180" width="350" height="78" rx="8" fill="#DCEAF7" stroke="#4C7FB0" stroke-width="1.8"/>
  <text x="655" y="204" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#1B3A55">Per-channel patching</text>
  <text x="655" y="226" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#2F4E68">each covariate channel becomes its own</text>
  <text x="655" y="246" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#2F4E68">token row on the batch axis (mask = 1)</text>

  <rect x="870" y="180" width="310" height="78" rx="8" fill="#E8E8EA" stroke="#8A8A93" stroke-width="1.8"/>
  <text x="1025" y="204" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#33333B">V-JEPA 2.1  ViT-L/16   (FROZEN)</text>
  <text x="1025" y="226" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#4A4A55">spatiotemporal tubelets, temporal stride 2</text>
  <text x="1025" y="246" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#4A4A55">motion is encoded inside the encoder</text>
</g>

<g id="tokenisers"><title>Projection into the 512-d token space</title>
  <rect x="90" y="296" width="740" height="104" rx="8" fill="#DCEAF7" stroke="#4C7FB0" stroke-width="1.8"/>
  <text x="460" y="320" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#1B3A55">input_patch_embedding   (PRETRAINED)</text>
  <text x="460" y="350" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#2F4E68">shared by the target row and all 14 covariate rows</text>
  <text x="460" y="384" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-style="italic" font-size="12" fill="#2F4E68">out:  context [B, 42, 512]   |   horizon [B, 1, 512]   |   14 covariate rows</text>

  <rect x="870" y="296" width="310" height="104" rx="8" fill="#FBE3D6" stroke="#D97742" stroke-width="1.8"/>
  <text x="1025" y="320" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#7A3A10">LatentSummarizer   (FROM SCRATCH)</text>
  <text x="1025" y="344" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#8A4A1E">Perceiver-style pooling, about 800:1:</text>
  <text x="1025" y="364" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#8A4A1E">784 patch tokens down to ONE vector</text>
  <text x="1025" y="388" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-style="italic" font-size="12" fill="#8A4A1E">out:  [B, n_vis, 512]  =  [B, 1, 512]</text>
</g>

<g id="membed"><title>MultimodalEmbedding</title>
  <rect x="90" y="438" width="1090" height="74" rx="8" fill="#FBE3D6" stroke="#D97742" stroke-width="1.8"/>
  <text x="635" y="462" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#7A3A10">MultimodalEmbedding (additive tags, FROM SCRATCH)  +  RoPE position ids</text>
  <text x="635" y="484" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#8A4A1E">modality {num = 0, vis = 1}  +  segment {context, horizon}  +  token-type {target, covariate, visual}  +  entity id</text>
  <text x="635" y="504" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-style="italic" fill="#9A6440">shape preserving. Modality dropout randomly zeroes the visual stream during training, so the model cannot lean on it blindly.</text>
</g>

<g id="fusion"><title>Late fusion</title>
  <rect x="90" y="550" width="1090" height="132" rx="8" fill="#FBE3D6" stroke="#D97742" stroke-width="1.8"/>
  <text x="635" y="578" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="bold" fill="#7A3A10">late fusion   --   CrossModalAdapter (FROM SCRATCH)</text>
  <text x="635" y="606" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#8A4A1E">the visual summary is projected into 1 soft token and appended as an extra ROW on the BATCH axis,</text>
  <text x="635" y="626" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#8A4A1E">sharing a group_id with the target row. Vision is therefore a sibling series, not a step in time.</text>
  <text x="635" y="646" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#8A4A1E">The time sequence itself stays purely numeric, which is why the frozen backbone still accepts it.</text>
  <text x="635" y="670" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-style="italic" font-size="12" fill="#7A3A10">out:  [B, 43, 512]   +   1 visual row on the batch axis</text>
</g>

<g id="encoder"><title>Chronos2Encoder</title>
  <rect x="90" y="720" width="1090" height="302" rx="12" fill="#EDF3F9" stroke="#4C7FB0" stroke-width="1.6"/>
  <text x="106" y="744" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#1B3A55">Chronos2Encoder  --  x6 identical blocks   FROZEN</text>

  <rect x="110" y="776" width="340" height="226" rx="8" fill="#DCEAF7" stroke="#4C7FB0" stroke-width="1.6"/>
  <text x="280" y="802" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#1B3A55">1. TimeSelfAttention + RoPE</text>
  <text x="280" y="830" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#2F4E68">causal self-attention along the TIME</text>
  <text x="280" y="850" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#2F4E68">axis, rotary positions.</text>
  <text x="280" y="876" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#2F4E68">The visual row runs through this</text>
  <text x="280" y="896" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#2F4E68">too, but as its own row.</text>
  <text x="280" y="944" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#1B3A55">PRETRAINED, FROZEN</text>
  <text x="280" y="976" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-style="italic" font-size="12" fill="#2F4E68">in / out:  [B + 1, 43, 512]</text>

  <rect x="470" y="776" width="340" height="226" rx="8" fill="#DCEAF7" stroke="#D97742" stroke-width="2.2"/>
  <text x="640" y="802" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#1B3A55">2. GroupSelfAttention</text>
  <text x="640" y="822" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-style="italic" fill="#B0641E">this is where vision enters in S2a</text>
  <text x="640" y="846" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#2F4E68">acts on the BATCH axis, not time.</text>
  <text x="640" y="866" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#2F4E68">Fuses the target row with the 14</text>
  <text x="640" y="886" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#2F4E68">covariate rows AND the 1 visual row.</text>
  <text x="640" y="944" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#1B3A55">PRETRAINED, FROZEN</text>
  <text x="640" y="976" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-style="italic" font-size="12" fill="#2F4E68">in / out:  [B + 1, 43, 512]</text>

  <rect x="830" y="776" width="340" height="226" rx="8" fill="#DCEAF7" stroke="#4C7FB0" stroke-width="1.6"/>
  <text x="1000" y="802" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#1B3A55">3. FeedForward</text>
  <text x="1000" y="944" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#1B3A55">PRETRAINED, FROZEN</text>
  <text x="1000" y="976" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-style="italic" font-size="12" fill="#2F4E68">in / out:  [B + 1, 43, 512]</text>
</g>

<g id="head"><title>Output head and forecast</title>
  <rect x="90" y="1076" width="410" height="48" rx="8" fill="#FBE3D6" stroke="#D97742" stroke-width="1.8"/>
  <text x="295" y="1106" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#7A3A10">Output head   (TRAINABLE)</text>

  <rect x="540" y="1060" width="250" height="80" rx="3" fill="#FDF0C8" stroke="#C9971E" stroke-width="2"/>
  <text x="665" y="1088" text-anchor="middle" font-family="Times New Roman, serif" font-style="italic" font-size="18" fill="#6B4E06">Y_hat</text>
  <text x="665" y="1112" text-anchor="middle" font-family="Times New Roman, serif" font-style="italic" font-size="14" fill="#6B4E06">[B, 12, 9]</text>
  <text x="665" y="1132" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#7A5C10">12 steps x 9 quantiles, one pass</text>
</g>

<g id="edges" stroke="#3A3A44" stroke-width="1.8" fill="none">
  <path d="M 265 140 L 265 178" marker-end="url(#arrow)"/>
  <path d="M 655 140 L 655 178" marker-end="url(#arrow)"/>
  <path d="M 1025 140 L 1025 178" marker-end="url(#arrow)"/>
  <path d="M 265 258 L 265 294" marker-end="url(#arrow)"/>
  <path d="M 655 258 L 655 294" marker-end="url(#arrow)"/>
  <path d="M 1025 258 L 1025 294" marker-end="url(#arrow)"/>
  <path d="M 460 400 L 460 436" marker-end="url(#arrow)"/>
  <path d="M 1025 400 L 1025 436" marker-end="url(#arrow)"/>
  <path d="M 635 512 L 635 548" marker-end="url(#arrow)"/>
  <path d="M 635 682 L 635 718" marker-end="url(#arrow)"/>
  <path d="M 295 1022 L 295 1074" marker-end="url(#arrow)"/>
  <path d="M 500 1100 L 536 1100" marker-end="url(#arrow)"/>
</g>

<g id="innerEdges" stroke="#7A7A86" stroke-width="1.6" fill="none">
  <path d="M 450 889 L 466 889" marker-end="url(#arrowLight)"/>
  <path d="M 810 889 L 826 889" marker-end="url(#arrowLight)"/>
</g>

<g id="edgeLabels" font-family="Helvetica, Arial, sans-serif" font-style="italic" font-size="11.5" fill="#4A4A55">
  <text x="277" y="282">[B, 42, 16] patches</text>
  <text x="667" y="282">14 channel rows</text>
  <text x="1037" y="282">[B, 4, 196, 1024]</text>
  <text x="472" y="428">numeric rows at 512</text>
  <text x="1037" y="428">visual summary  [B, 1, 512]</text>
  <text x="647" y="540">tagged token sequence</text>
  <text x="647" y="710">[B, 43, 512]  +  1 visual row</text>
  <text x="311" y="1050">last T_hor hidden states, target rows only:  [B, 1, 512]</text>
</g>

<g id="legend"><title>Legend</title>
  <rect x="1240" y="40" width="220" height="222" rx="10" fill="#FCFCFD" stroke="#C6C6CE" stroke-width="1.4"/>
  <text x="1256" y="64" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#1E1E28">Legend</text>
  <rect x="1256" y="82" width="22" height="13" rx="4" fill="#FBE3D6" stroke="#D97742" stroke-width="1.4"/>
  <text x="1288" y="93" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#3A3A44">trained from scratch</text>
  <rect x="1256" y="112" width="22" height="13" rx="4" fill="#DCEAF7" stroke="#4C7FB0" stroke-width="1.4"/>
  <text x="1288" y="123" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#3A3A44">pretrained Chronos-2</text>
  <rect x="1256" y="142" width="22" height="13" rx="4" fill="#E8E8EA" stroke="#8A8A93" stroke-width="1.4"/>
  <text x="1288" y="153" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#3A3A44">frozen (V-JEPA 2.1)</text>
  <rect x="1256" y="172" width="22" height="13" fill="#FFFFFF" stroke="#4A4A55" stroke-width="1.4"/>
  <text x="1288" y="183" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#3A3A44">data tensor</text>
  <rect x="1256" y="202" width="22" height="13" rx="3" fill="#FDF0C8" stroke="#C9971E" stroke-width="1.4"/>
  <text x="1288" y="213" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#3A3A44">model output</text>
  <rect x="1256" y="232" width="22" height="13" rx="4" fill="#DCEAF7" stroke="#D97742" stroke-width="2"/>
  <text x="1288" y="243" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#3A3A44">where vision enters</text>
</g>

</svg>
