<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#454854"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7D63A8"/>
    </marker>
  </defs>
  <rect width="1600" height="980" fill="#FFFFFF"/>
  <text x="800" y="42" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="25" font-weight="bold" fill="#242631">From Nemotron's visual path to S2d/S2e</text>
  <text x="800" y="70" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#626572">The shared design pattern is spatially addressable visual tokens, width alignment, and temporal-novelty selection.</text>

  <rect x="36" y="94" width="1528" height="300" rx="18" fill="#F5F0FA" stroke="#B8A5D1" stroke-width="1.8"/>
  <text x="62" y="126" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="bold" fill="#5C477B">Nemotron 3 Nano Omni: visual path</text>
  <text x="1538" y="126" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#746B80">source design</text>

  <g font-family="Helvetica, Arial, sans-serif">
    <rect x="62" y="168" width="184" height="118" rx="10" fill="#FFFFFF" stroke="#8D8F99" stroke-width="1.5"/>
    <text x="154" y="200" text-anchor="middle" font-size="15" font-weight="bold" fill="#292B34">Images / video</text>
    <g fill="#DDE9F5" stroke="#688AB0" stroke-width="1.1">
      <rect x="91" y="220" width="48" height="36"/><rect x="107" y="212" width="48" height="36"/><rect x="123" y="204" width="48" height="36"/>
    </g>
    <text x="154" y="274" text-anchor="middle" font-size="12" fill="#626572">native resolution</text>

    <rect x="278" y="168" width="184" height="118" rx="10" fill="#ECEDEF" stroke="#9699A1" stroke-width="1.5"/>
    <text x="370" y="198" text-anchor="middle" font-size="15" font-weight="bold" fill="#343640">Conv3D patching</text>
    <text x="370" y="226" text-anchor="middle" font-family="Times New Roman, serif" font-size="15" font-style="italic" fill="#4F515B">2 frames -&gt; 1 tubelet</text>
    <text x="370" y="252" text-anchor="middle" font-size="12" fill="#626572">video only</text>
    <text x="370" y="272" text-anchor="middle" font-size="12" fill="#626572">temporal compression</text>

    <rect x="494" y="168" width="184" height="118" rx="10" fill="#E3EFF8" stroke="#5787AF" stroke-width="1.8"/>
    <text x="586" y="198" text-anchor="middle" font-size="15" font-weight="bold" fill="#234B6B">C-RADIOv4-H</text>
    <text x="586" y="222" text-anchor="middle" font-size="13" fill="#315E80">vision encoder</text>
    <g fill="#BBD6EA" stroke="#5787AF" stroke-width="0.8">
      <rect x="538" y="238" width="16" height="16"/><rect x="558" y="238" width="16" height="16"/><rect x="578" y="238" width="16" height="16"/><rect x="598" y="238" width="16" height="16"/><rect x="618" y="238" width="16" height="16"/>
      <rect x="538" y="258" width="16" height="16"/><rect x="558" y="258" width="16" height="16"/><rect x="578" y="258" width="16" height="16"/><rect x="598" y="258" width="16" height="16"/><rect x="618" y="258" width="16" height="16"/>
    </g>

    <rect x="710" y="168" width="184" height="118" rx="10" fill="#E7F4EE" stroke="#5B9C7C" stroke-width="1.8"/>
    <text x="802" y="198" text-anchor="middle" font-size="15" font-weight="bold" fill="#2D674D">Pixel shuffle</text>
    <text x="802" y="224" text-anchor="middle" font-size="13" fill="#39785A">spatial token reduction</text>
    <text x="802" y="251" text-anchor="middle" font-family="Times New Roman, serif" font-size="15" font-style="italic" fill="#2D674D">4x fewer tokens</text>
    <text x="802" y="273" text-anchor="middle" font-size="12" fill="#626572">grid remains addressable</text>

    <rect x="926" y="168" width="184" height="118" rx="10" fill="#FFF0E6" stroke="#D2814F" stroke-width="1.8"/>
    <text x="1018" y="198" text-anchor="middle" font-size="15" font-weight="bold" fill="#7A421F">MLP vision adapter</text>
    <text x="1018" y="226" text-anchor="middle" font-size="13" fill="#8A4B25">token-wise projection</text>
    <text x="1018" y="254" text-anchor="middle" font-size="12" fill="#626572">aligns encoder and</text>
    <text x="1018" y="274" text-anchor="middle" font-size="12" fill="#626572">backbone widths</text>

    <rect x="1142" y="168" width="184" height="118" rx="10" fill="#F3E7F6" stroke="#9A68A7" stroke-width="2.2"/>
    <text x="1234" y="198" text-anchor="middle" font-size="15" font-weight="bold" fill="#674171">EVS</text>
    <text x="1234" y="224" text-anchor="middle" font-size="12.5" fill="#674171">cosine change at the</text>
    <text x="1234" y="244" text-anchor="middle" font-size="12.5" fill="#674171">same spatial position</text>
    <text x="1234" y="270" text-anchor="middle" font-size="12" fill="#626572">anchor + dynamic tokens</text>

    <rect x="1358" y="168" width="184" height="118" rx="10" fill="#EDF0F7" stroke="#6F7896" stroke-width="1.5"/>
    <text x="1450" y="198" text-anchor="middle" font-size="15" font-weight="bold" fill="#39415D">Visual prefix</text>
    <text x="1450" y="224" text-anchor="middle" font-size="13" fill="#4B5572">concatenated with text</text>
    <text x="1450" y="252" text-anchor="middle" font-size="12" fill="#626572">Nemotron LLM</text>
  </g>
  <g stroke="#454854" stroke-width="1.8" fill="none" marker-end="url(#arrow)">
    <path d="M246 227 H274"/><path d="M462 227 H490"/><path d="M678 227 H706"/><path d="M894 227 H922"/><path d="M1110 227 H1138"/><path d="M1326 227 H1354"/>
  </g>

  <rect x="36" y="486" width="1528" height="424" rx="18" fill="#EEF6FB" stroke="#8CB7D2" stroke-width="1.8"/>
  <text x="62" y="520" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="bold" fill="#315E80">S2d/S2e: forecasting adaptation</text>
  <text x="1538" y="520" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#607786">visual tokens enter Chronos-2 directly</text>

  <g font-family="Helvetica, Arial, sans-serif">
    <rect x="62" y="570" width="184" height="124" rx="10" fill="#FFFFFF" stroke="#8D8F99" stroke-width="1.5"/>
    <text x="154" y="601" text-anchor="middle" font-size="15" font-weight="bold" fill="#292B34">Satellite frames</text>
    <text x="154" y="627" text-anchor="middle" font-family="Times New Roman, serif" font-size="14" font-style="italic" fill="#4F515B">8 frames per window</text>
    <text x="154" y="655" text-anchor="middle" font-size="12" fill="#626572">past observations</text>

    <rect x="278" y="570" width="184" height="124" rx="10" fill="#ECEDEF" stroke="#9699A1" stroke-width="1.5"/>
    <text x="370" y="601" text-anchor="middle" font-size="15" font-weight="bold" fill="#343640">Frame selection</text>
    <text x="370" y="627" text-anchor="middle" font-size="12.5" fill="#555862">S2d: recent window</text>
    <text x="370" y="649" text-anchor="middle" font-size="12.5" fill="#555862">S2e: five daily anchors</text>
    <text x="370" y="674" text-anchor="middle" font-size="11.5" fill="#727580">no Conv3D tubelets</text>

    <rect x="494" y="570" width="184" height="124" rx="10" fill="#E3EFF8" stroke="#5787AF" stroke-width="1.8"/>
    <text x="586" y="601" text-anchor="middle" font-size="15" font-weight="bold" fill="#234B6B">Frozen V-JEPA 2.1</text>
    <text x="586" y="625" text-anchor="middle" font-size="13" fill="#315E80">visual encoder</text>
    <text x="586" y="654" text-anchor="middle" font-family="Times New Roman, serif" font-size="14" font-style="italic" fill="#234B6B">4 x 196 x 1024</text>

    <rect x="710" y="570" width="184" height="124" rx="10" fill="#E7F4EE" stroke="#5B9C7C" stroke-width="1.8"/>
    <text x="802" y="601" text-anchor="middle" font-size="15" font-weight="bold" fill="#2D674D">2 x 2 reduction</text>
    <text x="802" y="627" text-anchor="middle" font-size="13" fill="#39785A">14 x 14 -&gt; 7 x 7</text>
    <text x="802" y="654" text-anchor="middle" font-family="Times New Roman, serif" font-size="14" font-style="italic" fill="#2D674D">4 x 49 x 1024</text>
    <text x="802" y="676" text-anchor="middle" font-size="11.5" fill="#626572">spatial cells retained</text>

    <rect x="926" y="570" width="184" height="124" rx="10" fill="#FFF0E6" stroke="#D2814F" stroke-width="1.8"/>
    <text x="1018" y="601" text-anchor="middle" font-size="15" font-weight="bold" fill="#7A421F">Position-wise MLP</text>
    <text x="1018" y="627" text-anchor="middle" font-family="Times New Roman, serif" font-size="14" font-style="italic" fill="#7A421F">1024 -&gt; 768</text>
    <text x="1018" y="653" text-anchor="middle" font-size="12" fill="#626572">+ learned spatial</text>
    <text x="1018" y="674" text-anchor="middle" font-size="12" fill="#626572">cell embedding</text>

    <rect x="1142" y="570" width="184" height="124" rx="10" fill="#F3E7F6" stroke="#9A68A7" stroke-width="2.2"/>
    <text x="1234" y="601" text-anchor="middle" font-size="15" font-weight="bold" fill="#674171">EVS-style ranking</text>
    <text x="1234" y="627" text-anchor="middle" font-size="12.5" fill="#674171">same-cell cosine change</text>
    <text x="1234" y="653" text-anchor="middle" font-size="12" fill="#626572">fixed token budget during</text>
    <text x="1234" y="674" text-anchor="middle" font-size="12" fill="#626572">training and evaluation</text>

    <rect x="1358" y="550" width="184" height="76" rx="10" fill="#FCE6D8" stroke="#D2814F" stroke-width="1.8"/>
    <text x="1450" y="579" text-anchor="middle" font-size="14" font-weight="bold" fill="#7A421F">S2d</text>
    <text x="1450" y="603" text-anchor="middle" font-size="12" fill="#7A421F">1 window, 98 tokens</text>

    <rect x="1358" y="642" width="184" height="76" rx="10" fill="#E7F4EE" stroke="#5B9C7C" stroke-width="1.8"/>
    <text x="1450" y="671" text-anchor="middle" font-size="14" font-weight="bold" fill="#2D674D">S2e</text>
    <text x="1450" y="695" text-anchor="middle" font-size="12" fill="#2D674D">5 anchors x 20 tokens</text>
  </g>
  <g stroke="#454854" stroke-width="1.8" fill="none" marker-end="url(#arrow)">
    <path d="M246 632 H274"/><path d="M462 632 H490"/><path d="M678 632 H706"/><path d="M894 632 H922"/><path d="M1110 632 H1138"/><path d="M1326 612 H1354"/><path d="M1326 652 H1340 V680 H1354"/>
  </g>

  <rect x="582" y="778" width="884" height="84" rx="12" fill="#DDEAF5" stroke="#5787AF" stroke-width="2"/>
  <text x="1024" y="811" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#234B6B">Timestamp-aware interleaving with 42 numerical tokens</text>
  <text x="1024" y="840" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#315E80">Native Chronos-2 self-attention processes visual and numerical tokens in one sequence.</text>
  <path d="M1450 718 V748 H1024 V774" stroke="#454854" stroke-width="1.8" fill="none" marker-end="url(#arrow)"/>

  <g stroke="#7D63A8" stroke-width="1.6" stroke-dasharray="7 6" fill="none" marker-end="url(#arrow-purple)">
    <path d="M586 286 V555"/><path d="M802 286 V555"/><path d="M1018 286 V555"/><path d="M1234 286 V555"/>
  </g>
  <g font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#674171">
    <rect x="518" y="420" width="136" height="24" rx="6" fill="#FFFFFF"/><text x="586" y="436" text-anchor="middle">encoder role</text>
    <rect x="724" y="420" width="156" height="24" rx="6" fill="#FFFFFF"/><text x="802" y="436" text-anchor="middle">spatial reduction</text>
    <rect x="942" y="420" width="152" height="24" rx="6" fill="#FFFFFF"/><text x="1018" y="436" text-anchor="middle">width alignment</text>
    <rect x="1149" y="420" width="170" height="24" rx="6" fill="#FFFFFF"/><text x="1234" y="436" text-anchor="middle">temporal novelty</text>
  </g>

  <g font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#626572">
    <line x1="60" y1="940" x2="100" y2="940" stroke="#7D63A8" stroke-width="1.6" stroke-dasharray="7 6"/>
    <text x="112" y="944">concept adapted from Nemotron / EVS</text>
    <text x="1538" y="944" text-anchor="end">The integration target changes from a language-model prefix to a time-aligned forecasting sequence.</text>
  </g>
</svg>
