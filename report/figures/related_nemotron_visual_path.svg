    <text x="258" y="158" text-anchor="middle" font-size="15" font-weight="bold" fill="#2D674D">Audio</text>
    <path d="M196 190 h12 l9 -20 l11 38 l11 -30 l10 20 h13 l9 -13 l10 13 h22" stroke="#5B9C7C" stroke-width="2" fill="none"/>
    <rect x="474" y="120" width="384" height="100" rx="10" fill="#E4F2EA" stroke="#5B9C7C" stroke-width="1.6"/>
    <text x="666" y="156" text-anchor="middle" font-size="15" font-weight="bold" fill="#245740">Parakeet-TDT-0.6B-v2</text>
