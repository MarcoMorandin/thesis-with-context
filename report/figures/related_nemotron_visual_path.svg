    <text x="1176" y="318" text-anchor="middle" font-size="15" font-weight="bold" fill="#301A52">EVS</text>
    <text x="1176" y="342" text-anchor="middle" font-size="12" fill="#402868">drops redundant tokens</text>
    <text x="1176" y="364" text-anchor="middle" font-size="12" fill="#402868">video, inference only</text>
