    <text x="360" y="364" text-anchor="middle" font-size="12" fill="#5F4A85">video only</text>
    <rect x="474" y="284" width="180" height="100" rx="10" fill="#E6DBF5" stroke="#9A78C0" stroke-width="1.6"/>
