<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="660" viewBox="0 0 1240 660">
<!-- MINIMAL LAYOUT  (structure only; all rationale lives in the caption)
     row A in  : y 30..100    cols 60..550 | 570..1060
     row B fe  : y 130..176   same cols
     row C prj : y 206..258   60..1060
     row D mem : y 288..334   60..1060
     row E enc : y 384..514   sub-blocks 80..380 | 400..700 | 720..1040
     row F out : y 540..614   head 60..360 | Y_hat 420..660
     shape labels: x 1072 (right margin)
     Cairo notes: ASCII only ("->", "x", ". . ."); no tspan; >=20 px line spacing.
-->
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#3A3A44"/>
  </marker>
  <marker id="arrowLight" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#7A7A86"/>
  </marker>
</defs>

<rect x="0" y="0" width="1240" height="660" fill="#FFFFFF"/>

<g id="inputs"><title>Input tensors</title>
  <rect x="60" y="30" width="490" height="70" rx="3" fill="#FFFFFF" stroke="#4A4A55" stroke-width="1.8"/>
  <text x="305" y="56" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#1E1E28">PV power history</text>
  <text x="305" y="80" text-anchor="middle" font-family="Times New Roman, serif" font-style="italic" font-size="14" fill="#2E2E38">Y_hist   [B, 672]</text>

  <rect x="570" y="30" width="490" height="70" rx="3" fill="#FFFFFF" stroke="#4A4A55" stroke-width="1.8"/>
  <text x="815" y="56" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#1E1E28">Known covariates</text>
  <text x="815" y="80" text-anchor="middle" font-family="Times New Roman, serif" font-style="italic" font-size="14" fill="#2E2E38">X_cov   [B, 684, 14]</text>
</g>

<g id="frontends"><title>Per-modality front ends</title>
  <rect x="60" y="130" width="490" height="46" rx="8" fill="#DCEAF7" stroke="#4C7FB0" stroke-width="1.8"/>
  <text x="305" y="159" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#1B3A55">InstanceNorm (arcsinh) + Patch(16)</text>

  <rect x="570" y="130" width="490" height="46" rx="8" fill="#DCEAF7" stroke="#4C7FB0" stroke-width="1.8"/>
  <text x="815" y="159" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#1B3A55">Per-channel patching</text>
</g>

<g id="tokenisers"><title>Projection into the 512-d token space</title>
  <rect x="60" y="206" width="1000" height="52" rx="8" fill="#DCEAF7" stroke="#4C7FB0" stroke-width="1.8"/>
  <text x="560" y="238" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#1B3A55">input_patch_embedding   (PRETRAINED)</text>
</g>

<g id="membed"><title>MultimodalEmbedding</title>
  <rect x="60" y="288" width="1000" height="46" rx="8" fill="#FBE3D6" stroke="#D97742" stroke-width="1.8"/>
  <text x="560" y="317" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#7A3A10">MultimodalEmbedding  +  RoPE position ids</text>
</g>

<g id="encoder"><title>Chronos2Encoder</title>
  <rect x="60" y="384" width="1000" height="130" rx="12" fill="#EDF3F9" stroke="#4C7FB0" stroke-width="1.6"/>
  <text x="78" y="408" font-family="Helvetica, Arial, sans-serif" font-size="13.5" font-weight="bold" fill="#1B3A55">Chronos2Encoder  --  x12 identical blocks   (PRETRAINED, fine-tuned)</text>

  <rect x="80" y="424" width="300" height="70" rx="8" fill="#DCEAF7" stroke="#4C7FB0" stroke-width="1.6"/>
  <text x="230" y="465" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#1B3A55">TimeSelfAttention + RoPE</text>

  <rect x="400" y="424" width="300" height="70" rx="8" fill="#DCEAF7" stroke="#4C7FB0" stroke-width="1.6"/>
  <text x="550" y="465" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#1B3A55">GroupSelfAttention</text>

  <rect x="720" y="424" width="320" height="70" rx="8" fill="#DCEAF7" stroke="#4C7FB0" stroke-width="1.6"/>
  <text x="880" y="465" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#1B3A55">FeedForward</text>
</g>

<g id="head"><title>Output head and forecast</title>
  <rect x="60" y="554" width="300" height="46" rx="8" fill="#FBE3D6" stroke="#D97742" stroke-width="1.8"/>
  <text x="210" y="583" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#7A3A10">Output head   (RE-INITIALISED)</text>

  <rect x="420" y="540" width="240" height="74" rx="3" fill="#FDF0C8" stroke="#C9971E" stroke-width="2"/>
  <text x="540" y="570" text-anchor="middle" font-family="Times New Roman, serif" font-style="italic" font-size="18" fill="#6B4E06">Y_hat</text>
  <text x="540" y="594" text-anchor="middle" font-family="Times New Roman, serif" font-style="italic" font-size="14" fill="#6B4E06">[B, 12, 9]</text>
</g>

<g id="edges" stroke="#3A3A44" stroke-width="1.8" fill="none">
  <path d="M 305 100 L 305 128" marker-end="url(#arrow)"/>
  <path d="M 815 100 L 815 128" marker-end="url(#arrow)"/>
  <path d="M 305 176 L 305 204" marker-end="url(#arrow)"/>
  <path d="M 815 176 L 815 204" marker-end="url(#arrow)"/>
  <path d="M 560 258 L 560 286" marker-end="url(#arrow)"/>
  <path d="M 560 334 L 560 382" marker-end="url(#arrow)"/>
  <path d="M 210 514 L 210 552" marker-end="url(#arrow)"/>
  <path d="M 360 577 L 416 577" marker-end="url(#arrow)"/>
</g>

<g id="innerEdges" stroke="#7A7A86" stroke-width="1.6" fill="none">
  <path d="M 380 459 L 396 459" marker-end="url(#arrowLight)"/>
  <path d="M 700 459 L 716 459" marker-end="url(#arrowLight)"/>
</g>

<g id="edgeLabels" font-family="Helvetica, Arial, sans-serif" font-style="italic" font-size="11.5" fill="#4A4A55">
  <text x="317" y="198">[B, 42, 16] patches</text>
  <text x="827" y="198">14 channel rows</text>
  <text x="572" y="280">target, horizon and covariate rows, all at 512</text>
  <text x="572" y="364">[B, 43, 512]  --  tagged token sequence</text>
  <text x="222" y="542">last hidden state   [B, 1, 512]</text>
</g>

<g id="legend"><title>Legend</title>
  <rect x="1072" y="384" width="150" height="122" rx="8" fill="#FCFCFD" stroke="#C6C6CE" stroke-width="1.2"/>
  <rect x="1086" y="402" width="20" height="12" rx="4" fill="#DCEAF7" stroke="#4C7FB0" stroke-width="1.3"/>
  <text x="1114" y="412" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#3A3A44">Chronos-2</text>
  <rect x="1086" y="426" width="20" height="12" rx="4" fill="#FBE3D6" stroke="#D97742" stroke-width="1.3"/>
  <text x="1114" y="436" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#3A3A44">trained</text>
  <rect x="1086" y="450" width="20" height="12" fill="#FFFFFF" stroke="#4A4A55" stroke-width="1.3"/>
  <text x="1114" y="460" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#3A3A44">data tensor</text>
  <rect x="1086" y="474" width="20" height="12" rx="3" fill="#FDF0C8" stroke="#C9971E" stroke-width="1.3"/>
  <text x="1114" y="484" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#3A3A44">forecast</text>
</g>

</svg>
