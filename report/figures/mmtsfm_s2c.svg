<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1118" viewBox="0 0 1500 1118">
<!-- LAYOUT PLAN  (rows A-C shared with the other stage figures)
     row A in : y 40..140    cols 90..440 | 480..830 | 870..1180
     row B fe : y 180..258   same cols
     row C prj: y 296..400   numeric 90..830 | vision 870..1180
     row D mem: y 438..512   numeric only, 90..830 (the field is not tagged)
     row E enc: y 550..960   2x2 serpentine, blocks 125/655 x 598/786, each 490x160
     row F out: y 998..1078  90..500 | 540..790
     rail     : x 1240..1460 (legend 40..262)
     NOTE: there is no fusion row in S2c because there is no fusion op: the
     sequence entering the encoder is the vision-free one. The encoder is 2x2
     rather than 1xN so that the visual field can reach the cross-attention
     sub-layer from outside the sequence in three short segments.
     Cairo mis-spaces the "fu" pair in Times italic, so annotations use
     Helvetica italic; serif italic is kept for single symbols only.
-->
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#3A3A44"/>
  </marker>
  <marker id="arrowLight" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#7A7A86"/>
  </marker>
  <marker id="arrowVis" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#D97742"/>
  </marker>
</defs>

<rect x="0" y="0" width="1500" height="1118" fill="#FFFFFF"/>

<g id="inputs"><title>Input tensors</title>
  <rect x="90" y="40" width="350" height="100" rx="3" fill="#FFFFFF" stroke="#4A4A55" stroke-width="1.8"/>
  <text x="265" y="64" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#1E1E28">Numeric target -- PV power</text>
  <text x="265" y="88" text-anchor="middle" font-family="Times New Roman, serif" font-style="italic" font-size="14" fill="#2E2E38">Y_hist   [B, 672]</text>
  <text x="265" y="110" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#5A5A66">672 historical steps per entity</text>

  <rect x="480" y="40" width="350" height="100" rx="3" fill="#FFFFFF" stroke="#4A4A55" stroke-width="1.8"/>
  <text x="655" y="64" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#1E1E28">Known covariates</text>
  <text x="655" y="88" text-anchor="middle" font-family="Times New Roman, serif" font-style="italic" font-size="14" fill="#2E2E38">X_cov   [B, 672 + 12, 14]</text>
  <text x="655" y="110" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#5A5A66">14 protocol channels</text>

  <rect x="870" y="40" width="310" height="100" rx="3" fill="#FFFFFF" stroke="#4A4A55" stroke-width="1.8"/>
  <text x="1025" y="64" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#1E1E28">Sky / satellite video</text>
  <text x="1025" y="88" text-anchor="middle" font-family="Times New Roman, serif" font-style="italic" font-size="14" fill="#2E2E38">V   [B, 3, 8, 224, 224]</text>
  <text x="1025" y="110" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#5A5A66">8 RGB frames over a 6 h window</text>
  <text x="1025" y="130" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#5A5A66">ending at the forecast origin</text>
</g>

<g id="frontends"><title>Per-modality front ends</title>
  <rect x="90" y="180" width="350" height="78" rx="8" fill="#DCEAF7" stroke="#4C7FB0" stroke-width="1.8"/>
  <text x="265" y="204" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#1B3A55">InstanceNorm (arcsinh) + Patch(16)</text>
  <text x="265" y="226" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#2F4E68">out: patched context and per-patch mask</text>
  <text x="265" y="246" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#2F4E68">plus (loc, scale), kept for the inverse</text>

  <rect x="480" y="180" width="350" height="78" rx="8" fill="#DCEAF7" stroke="#4C7FB0" stroke-width="1.8"/>
  <text x="655" y="204" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#1B3A55">Per-channel patching</text>
  <text x="655" y="226" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#2F4E68">each covariate channel becomes its own</text>
  <text x="655" y="246" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#2F4E68">token row on the batch axis (mask = 1)</text>

  <rect x="870" y="180" width="310" height="78" rx="8" fill="#E8E8EA" stroke="#8A8A93" stroke-width="1.8"/>
  <text x="1025" y="204" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#33333B">V-JEPA 2.1  ViT-L/16   (FROZEN)</text>
  <text x="1025" y="226" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#4A4A55">spatiotemporal tubelets, temporal stride 2</text>
  <text x="1025" y="246" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#4A4A55">the patch grid is kept, not pooled away</text>
</g>

<g id="tokenisers"><title>Projection into the 512-d token space</title>
  <rect x="90" y="296" width="740" height="104" rx="8" fill="#DCEAF7" stroke="#4C7FB0" stroke-width="1.8"/>
  <text x="460" y="320" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#1B3A55">input_patch_embedding (PRETRAINED)   +   future_patch_embedding (TRAINABLE, NEW)</text>
  <text x="460" y="350" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#2F4E68">patch in = 16 but patch out = 4</text>
  <text x="460" y="384" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-style="italic" font-size="12" fill="#2F4E68">out:  context [B, 42, 512]   |   horizon [B, 3, 512]   |   14 covariate rows</text>

  <rect x="870" y="296" width="310" height="104" rx="8" fill="#FBE3D6" stroke="#D97742" stroke-width="1.8"/>
  <text x="1025" y="320" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#7A3A10">4x4 block-pool + visual_kv_proj</text>
  <text x="1025" y="344" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#8A4A1E">no LatentSummarizer, no adapter:</text>
  <text x="1025" y="364" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#8A4A1E">V-JEPA patches project straight to KV</text>
  <text x="1025" y="388" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-style="italic" font-size="12" fill="#8A4A1E">out:  [B, 4 x 4 x 4, 512]  =  [B, 64, 512]</text>
</g>

<g id="membed"><title>MultimodalEmbedding, numeric sequence only</title>
  <rect x="90" y="438" width="740" height="74" rx="8" fill="#FBE3D6" stroke="#D97742" stroke-width="1.8"/>
  <text x="460" y="462" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#7A3A10">MultimodalEmbedding (TRAINABLE)  +  RoPE  +  lead-time embedding</text>
  <text x="460" y="484" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#8A4A1E">segment {context, horizon}  +  token-type {target, covariate}  +  entity id  --  identical to Stage 1</text>
  <text x="460" y="504" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-style="italic" fill="#9A6440">modality is a dead channel here.</text>
</g>

<g id="encoder"><title>Chronos2Encoder</title>
  <rect x="90" y="550" width="1090" height="410" rx="12" fill="#EDF3F9" stroke="#4C7FB0" stroke-width="1.6"/>
  <text x="106" y="578" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#1B3A55">Chronos2Encoder  --  x6 blocks</text>
  <text x="1164" y="578" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#2F4E68">top 3 of 6 unfrozen; cross-attention exists in blocks 3 to 6</text>

  <rect x="125" y="598" width="490" height="160" rx="8" fill="#DCEAF7" stroke="#4C7FB0" stroke-width="1.6"/>
  <text x="370" y="624" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#1B3A55">1. TimeSelfAttention + RoPE</text>
  <text x="370" y="656" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#2F4E68">causal self-attention along the TIME axis, rotary positions.</text>
  <text x="370" y="678" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#2F4E68">The sequence here is purely numeric: no visual token holds a</text>
  <text x="370" y="700" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#2F4E68">position, so this sub-layer is unchanged from Stage 1.</text>
  <text x="370" y="726" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#1B3A55">TOP 3 BLOCKS TRAIN</text>
  <text x="370" y="748" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-style="italic" font-size="12" fill="#2F4E68">in / out:  [B, 45, 512]</text>

  <rect x="655" y="598" width="490" height="160" rx="8" fill="#DCEAF7" stroke="#D97742" stroke-width="2.2"/>
  <text x="900" y="624" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#1B3A55">2. TimeCrossAttention</text>
  <text x="900" y="646" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-style="italic" fill="#B0641E">this is where vision enters in S2c</text>
  <text x="900" y="674" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#2F4E68">the 3 forecast positions QUERY the 64 visual KV entries; a gate</text>
  <text x="900" y="696" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#2F4E68">keeps the update on those rows, so the history stays untouched.</text>
  <text x="900" y="726" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#7A3A10">NEW MODULE, TRAINS</text>
  <text x="900" y="748" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-style="italic" font-size="12" fill="#2F4E68">q [B, 3, 512]   x   kv [B, 64, 512]</text>

  <rect x="655" y="786" width="490" height="160" rx="8" fill="#DCEAF7" stroke="#4C7FB0" stroke-width="1.6"/>
  <text x="900" y="812" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#1B3A55">3. GroupSelfAttention</text>
  <text x="900" y="844" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#2F4E68">acts on the BATCH axis, not time. Fuses the target row with</text>
  <text x="900" y="866" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#2F4E68">the 14 covariate rows across a shared group_id.</text>
  <text x="900" y="914" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#1B3A55">TOP 3 BLOCKS TRAIN</text>
  <text x="900" y="936" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-style="italic" font-size="12" fill="#2F4E68">in / out:  [B, 45, 512]</text>

  <rect x="125" y="786" width="490" height="160" rx="8" fill="#DCEAF7" stroke="#4C7FB0" stroke-width="1.6"/>
  <text x="370" y="812" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#1B3A55">4. FeedForward</text>
  <text x="370" y="914" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#1B3A55">TOP 3 BLOCKS TRAIN</text>
  <text x="370" y="936" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-style="italic" font-size="12" fill="#2F4E68">in / out:  [B, 45, 512]</text>
</g>

<g id="head"><title>Output head and forecast</title>
  <rect x="90" y="1014" width="410" height="48" rx="8" fill="#FBE3D6" stroke="#D97742" stroke-width="1.8"/>
  <text x="295" y="1044" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#7A3A10">Output head   (TRAINABLE)</text>

  <rect x="540" y="998" width="250" height="80" rx="3" fill="#FDF0C8" stroke="#C9971E" stroke-width="2"/>
  <text x="665" y="1026" text-anchor="middle" font-family="Times New Roman, serif" font-style="italic" font-size="18" fill="#6B4E06">Y_hat</text>
  <text x="665" y="1050" text-anchor="middle" font-family="Times New Roman, serif" font-style="italic" font-size="14" fill="#6B4E06">[B, 12, 9]</text>
  <text x="665" y="1070" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#7A5C10">3 patches x 4 steps x 9 quantiles</text>
</g>

<g id="edges" stroke="#3A3A44" stroke-width="1.8" fill="none">
  <path d="M 265 140 L 265 178" marker-end="url(#arrow)"/>
  <path d="M 655 140 L 655 178" marker-end="url(#arrow)"/>
  <path d="M 1025 140 L 1025 178" marker-end="url(#arrow)"/>
  <path d="M 265 258 L 265 294" marker-end="url(#arrow)"/>
  <path d="M 655 258 L 655 294" marker-end="url(#arrow)"/>
  <path d="M 1025 258 L 1025 294" marker-end="url(#arrow)"/>
  <path d="M 460 400 L 460 436" marker-end="url(#arrow)"/>
  <path d="M 370 512 L 370 596" marker-end="url(#arrow)"/>
  <path d="M 295 946 L 295 1012" marker-end="url(#arrow)"/>
  <path d="M 500 1038 L 536 1038" marker-end="url(#arrow)"/>
</g>

<g id="visualBypass" stroke="#D97742" stroke-width="2" fill="none" stroke-dasharray="8 6">
  <path d="M 1025 400 L 1025 430 L 1208 430 L 1208 678 L 1149 678" marker-end="url(#arrowVis)"/>
</g>

<g id="innerEdges" stroke="#7A7A86" stroke-width="1.8" fill="none">
  <path d="M 615 678 L 651 678" marker-end="url(#arrowLight)"/>
  <path d="M 900 758 L 900 782" marker-end="url(#arrowLight)"/>
  <path d="M 655 866 L 619 866" marker-end="url(#arrowLight)"/>
</g>

<g id="edgeLabels" font-family="Helvetica, Arial, sans-serif" font-style="italic" font-size="11.5" fill="#4A4A55">
  <text x="277" y="282">[B, 42, 16] patches</text>
  <text x="667" y="282">14 channel rows</text>
  <text x="1037" y="282">[B, 4, 196, 1024]</text>
  <text x="472" y="424">numeric rows at 512</text>
  <text x="1195" y="458" text-anchor="end" fill="#B0641E">visual KV field   [B, 64, 512]</text>
  <text x="1195" y="476" text-anchor="end" fill="#B0641E">held outside the sequence</text>
  <text x="386" y="536">[B, 45, 512]  --  the vision-free sequence</text>
  <text x="311" y="984" font-size="11">the 3 forecast positions, target rows only:  [B, 3, 512]</text>
</g>

<g id="legend"><title>Legend</title>
  <rect x="1240" y="40" width="220" height="222" rx="10" fill="#FCFCFD" stroke="#C6C6CE" stroke-width="1.4"/>
  <text x="1256" y="64" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#1E1E28">Legend</text>
  <rect x="1256" y="82" width="22" height="13" rx="4" fill="#FBE3D6" stroke="#D97742" stroke-width="1.4"/>
  <text x="1288" y="93" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#3A3A44">trained from scratch</text>
  <rect x="1256" y="112" width="22" height="13" rx="4" fill="#DCEAF7" stroke="#4C7FB0" stroke-width="1.4"/>
  <text x="1288" y="123" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#3A3A44">pretrained Chronos-2</text>
  <rect x="1256" y="142" width="22" height="13" rx="4" fill="#E8E8EA" stroke="#8A8A93" stroke-width="1.4"/>
  <text x="1288" y="153" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#3A3A44">frozen (V-JEPA 2.1)</text>
  <rect x="1256" y="172" width="22" height="13" fill="#FFFFFF" stroke="#4A4A55" stroke-width="1.4"/>
  <text x="1288" y="183" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#3A3A44">data tensor</text>
  <rect x="1256" y="202" width="22" height="13" rx="3" fill="#FDF0C8" stroke="#C9971E" stroke-width="1.4"/>
  <text x="1288" y="213" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#3A3A44">model output</text>
  <line x1="1256" y1="238" x2="1278" y2="238" stroke="#D97742" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="1288" y="243" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#3A3A44">visual side channel</text>
</g>

</svg>
