# Project-local Codex configuration. Codex loads this layer after the project is trusted.

[mcp_servers.gitnexus]
command = "gitnexus"
args = ["mcp"]

[mcp_servers.lean-ctx]
command = "lean-ctx"

[mcp_servers.lean-ctx.tools.ctx_shell]
approval_mode = "approve"

[mcp_servers.lean-ctx.tools.ctx_search]
approval_mode = "approve"
