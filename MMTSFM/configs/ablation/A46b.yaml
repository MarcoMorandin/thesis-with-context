# @package _global_
# A46b — depth-matched multi-anchor: FIVE anchors, each one bit-for-bit S2D.
#
# THE CLAIM UNDER TEST. S2E lost 0.0094 SS to S2D while adding four anchors.
# A46 held the ladder and moved the selector (paired_novelty): null, 0.5416
# +/- 0.0031 against S2E's 0.5409 +/- 0.0015, five times under the 0.0037
# floor. So selection is not the cause. What remains is the PAYLOAD: S2E's
# anchor carries T_lat=2 latents and keeps 20 of its 98 candidate tokens (20%),
# while S2D's carries T_lat=4 and keeps 98 of 196 (50%). Every S2E anchor is a
# quarter of an S2D anchor in depth and a fifth of it in tokens. This arm
# removes that confound: make the anchor identical and move ONLY the count.
#
# WHAT AN ANCHOR IS HERE. 8 frames at 45 min (5.25 h burst) -> V-JEPA tubelet
# stride 2 -> T_lat=4 -> 4 x 49 = 196 candidates -> `novelty` keeps 98:
# 49 pinned first-latent cells (+inf) + 49 by cosine dissimilarity. That is
# S2D's rule, S2D's depth, S2D's retention, S2D's token count. Verified against
# evs_select directly: at n_groups=K and keep=98K, anchor k draws only its own
# four latent frames, each leg identical to a standalone S2D call at keep=98.
#
# NO EXTRACTION. THIS ARM RE-READS THE S2D CACHE.
# Cache keys are {dataset}_{site}_{origin} and do not encode the ladder
# (pv_record.py::_entity_cache_key), so the entry the extractor wrote for
# origin t-24h IS the 8-frame burst ending at t-24h — exactly anchor 1 of this
# ladder. `data.visual_latent_anchors: 5` assembles Z from five such entries
# instead of one. Cost: 0 G of new cache, 0 GPU-hours of extraction.
#
# This was measured, not assumed. probe_anchor_cache_coverage.py over
# vit_large_f8_s224_nonhrv_sp45 (job 57888808, 139,612 entries / 210 G):
#   test  19,964 origins, 14/14 plants, modal spacing 6.00 h -> 24 h divides it
#         complete 5-ladders: 98.5%   (4-anchor 98.8%, 3-anchor 99.1%)
#   train 98,272 origins, 69/69 plants, modal spacing 6.00 h (= TRAIN_STRIDE H)
#         complete 5-ladders: 98.4%
# Against the a24h ladder's 94.4% and the 8 h ladder's 0.0%, this is the best
# origin coverage any ladder in the registry has shown. The earlier version of
# this file budgeted 420 G / 16 h GPU for a fresh 16-frame extraction and cut
# the design to two anchors to fit the 1 TB quota; that arithmetic is void and
# the anchor count is now free.
#
# DO NOT DELETE vit_large_f8_s224_nonhrv_sp45. Under this route the s2d cache
# stops being a scored control's leftovers and becomes this arm's INPUT.
#
# THE 1.5% THAT DOES NOT RESOLVE. Windows without a complete ladder are dropped
# from the index at setup (_drop_incomplete_ladders), and a miss after that
# RAISES rather than falling back to a live encode — the fallback would train
# 1.5% of windows on a different visual payload with nothing in the logs to say
# which. The cost is that this arm's evaluation set is a strict subset of
# S2D's. Re-score S2D (and S2E) on the SAME surviving windows before quoting a
# delta, or the count effect is entangled with a 1.5% change of test set. That
# is a re-score, not a re-train.
#
# MODE CHANGE, MANDATORY. `visual_evs_mode` moves paired_novelty -> novelty.
# Not a design choice: paired_novelty raises "paired_novelty requires exactly
# two latent frames per anchor" for any T != 2 (patch_projector.py). At T_lat=4
# it cannot run. novelty is what S2D itself uses, so this also restores lineage
# with the control rather than with A46.
#
# GUARDS, all checked: 24 h stride = 3 TS patches x 8 h (visual_position_span
# _seconds, vision_chronos2_s2e.yaml:101,118); T_lat 20 % n_vis 5 = 0;
# keep 490 % 5 = 0 -> 98 per anchor; video_frames 40 % frames_per_anchor 8 = 0
# and 40 = 5 x 8 (enforced by visual_latent_anchors); burst span 5.25 h <= 24 h
# stride; oldest frame at 4*24 + 5.25 = 101.25 h < visual_window_hours 102.
#
# COST IS NOW MEMORY, NOT DISK. Sequence 42 TS + 490 visual + 1 future = 533,
# against S2D's 141 and S2E's 143 — roughly 14x S2D's attention cost. Launch
# seed 42 ALONE first as a memory probe at BATCH_SIZE=2 ACCUM=8 (stage_cmd.sh
# holds the effective batch at ukpv.yaml's 16). If it OOMs, drop to 3 anchors
# (visual_latent_anchors: 3, video_frames: 24, visual_window_hours 54,
# n_visual_context_steps: 3, visual_evs_keep: 294, coverage 99.1%) — the same
# claim at a smaller count, still free of extraction.
#
# Comparators: S2D for the count effect at identical anchor construction (the
# headline); S2E and A46 for what depth-matching bought at the same count.
# Report cross-plant NMAE, NRMSE, NRMSE skill score, ramp metrics, calibration,
# and the same-weight vision-off marginal.
defaults:
  - /stage/s2e

seed: 42
train: true
test: true

data:
  # FIVE bursts of 8 at 45 min, 24 h apart. Offsets (k // 8) * 24 h +
  # (k % 8) * 45 min; oldest frame at 96 + 5.25 = 101.25 h.
  video_frames: 40
  visual_window_hours: 102.0       # covers 96 h + 5.25 h burst span
  visual_frame_spacing_min: 45.0   # UNCHANGED — the proven in-burst step
  visual_anchor_stride_hours: 24.0 # three Chronos-2 input patches (3 * 8 h)
  visual_frames_per_anchor: 8      # 40 / 8 = 5 bursts = 5 anchors, T_lat=4 each
  # Assemble Z from the s2d cache at origins t-96h ... t instead of extracting.
  visual_latent_anchors: 5

model:
  vision_cfg:
    n_visual_context_steps: 5
    visual_evs_mode: novelty       # paired_novelty cannot run at T_lat != 2
    visual_evs_keep: 490           # 98 per anchor = S2D exactly
  results_tag: mmtsfm_A46b_s2e_ukpv
  compute_marginal_gain: true
