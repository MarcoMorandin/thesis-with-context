defaults:
  - trainer: default
  - model: vision_chronos2
  - data: ukpv
  - logger: wandb
  - _self_

# Core configurations
seed: 42
project_name: mmtsfm
run_name: ${now:%Y-%m-%d_%H-%M-%S}_run
# ckpt_path = FULL-STATE resume (optimizer + epoch), for same-stage requeue only.
ckpt_path: null
# init_ckpt = WEIGHTS-ONLY warm start (fresh optimizer + epoch 0), for chaining
# curriculum stages (S1 -> S2a -> ...). Loads the prior stage's model weights
# with strict=False so added/removed modules and changed freezing are tolerated.
init_ckpt: null

hydra:
  run:
    dir: logs/experiments/runs/${now:%Y-%m-%d}_${now:%H-%M-%S}
  sweep:
    dir: logs/experiments/multiruns/${now:%Y-%m-%d}_${now:%H-%M-%S}
    subdir: ${hydra.job.num}
