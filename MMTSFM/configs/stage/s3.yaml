# @package _global_
# Stage 3 — Full joint fine-tuning, interleaved. Nothing frozen on the Chronos
# side; V-JEPA unfreezes progressively (last 4 blocks at epoch 0, +4 each epoch)
# to avoid early feature corruption. Full asymmetric modality dropout enforces
# modality-robust representations. End-to-end cross-modal optimization for
# cross-plant PV generalization.
# Resume from the Stage-2b checkpoint (+ckpt_path=<s2b best>).
model:
  freeze_chronos: false
  grassmann_warmup_steps: 0
  n_visual_unfreeze_layers: 4
  progressive_vision_unfreeze: true
  progressive_unfreeze_interval: 1
  chronos_core_cfg:
    use_grassmann: true
  vision_cfg:
    skip_vision_stack: false
    fusion_mode: interleaved
    freeze_visual_encoder: partial
    visual_dropout_prob: 0.5
    numeric_dropout_prob: 0.1
data:
  emit_vision: true
