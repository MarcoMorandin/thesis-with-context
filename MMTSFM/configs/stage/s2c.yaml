# @package _global_
# Stage 2c — future-query cross-attention over a RETAINED spatial field.
#
# The freeze policy is deliberately identical to Stage 2b, so that s2c-vs-s2b
# isolates the fusion mechanism and nothing else. What changes is only WHERE the
# visual information enters: s2b concatenates pooled visual tokens into the
# sequence, s2c leaves the sequence untouched and lets the FORECAST positions
# cross-attend a 4x4x4 V-JEPA field through the last k encoder blocks.
#
# The vision stack (LatentSummarizer + CrossModalAdapter) is bypassed entirely —
# it is the ~800:1 pooling in that stack which ticket 13 showed destroys the
# spatial structure the latent probe found (ramp R^2 0.0060 at 1x1 vs 0.0512 at
# 4x4, t+30).
#
# Warm-start from the STAGE-1 checkpoint, not s2a: s2c has no summarizer or
# adapter to pre-align, so an s2a checkpoint would contribute nothing but a
# different numeric optimum and confound the comparison.
#   START_STAGE=s2c END_STAGE=s2c INIT_CKPT=<uk_pv_s1_selfattn_sNN/best.ckpt>
model:
  freeze_chronos: true
  grassmann_warmup_steps: 0
  # use_grassmann is decided by the model config, not the stage.
  vision_cfg:
    skip_vision_stack: false
    fusion_mode: future_query
    freeze_visual_encoder: true
    visual_dropout_prob: 0.5
    numeric_dropout_prob: 0.1
data:
  emit_vision: true
