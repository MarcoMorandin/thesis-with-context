# @package _global_
# Stage 2d — interleaved vision WITHOUT a resampler.
#
# The freeze policy is deliberately identical to Stage 2b and Stage 2c, so that
# s2d-vs-s2b isolates the visual path and nothing else. What changes is only how
# the visual payload is built: s2b pools the whole V-JEPA patch field through the
# LatentSummarizer's learned queries into ONE token at ONE position; s2d pixel-
# shuffles the field, projects it with a plain MLP, and drops 98 surviving tokens
# into the sequence at fractional positions inside the last context patch.
#
# The vision stack (LatentSummarizer + CrossModalAdapter) is not bypassed here —
# it is not BUILT. `interleaved_raw` constructs a VisualPatchProjector instead.
# That is the arm's hypothesis: the ~800:1 learned-query bottleneck is what pins
# every pooled arm to the ramp seed floor (latent probe: ramp R^2 0.0060 at 1x1
# vs 0.0512 at 4x4, t+30).
#
# Warm-start from the STAGE-1 checkpoint, not s2a/s2b: s2d has no summarizer or
# adapter to pre-align, and reusing an s2b checkpoint would carry the pooled
# arm's numeric optimum into the comparison it is supposed to be measured against.
# Same warm start as s2c and A29, so the three-way attribution holds.
#   START_STAGE=s2d END_STAGE=s2d INIT_CKPT=<uk_pv_s1_selfattn_sNN/best.ckpt>
model:
  freeze_chronos: true
  grassmann_warmup_steps: 0
  # use_grassmann is decided by the model config, not the stage.
  #
  # Stage 0 (Nemotron §3.1.1, vision-projector warmup): for the first 500 steps
  # only the projector + cell embedding see a non-zero LR, everything else is
  # held at 0. Guards against a freshly initialised projector injecting noise into
  # a frozen Chronos-2 at step 0. Implemented as an LR gate rather than a
  # requires_grad toggle, because flipping requires_grad mid-run re-buckets DDP
  # gradients. Runs inside the same job, so the step budget and seed protocol are
  # unchanged.
  projector_warmup_steps: 500
  vision_cfg:
    skip_vision_stack: false
    fusion_mode: interleaved_raw
    freeze_visual_encoder: true
    visual_dropout_prob: 0.5
    numeric_dropout_prob: 0.1
data:
  emit_vision: true
